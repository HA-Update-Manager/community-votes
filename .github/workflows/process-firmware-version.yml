name: Process firmware-version submission

on:
  issues:
    # "reopened" is check-stuck-votes.yml's own self-healing retry for this
    # workflow specifically (see that file): closing and reopening an issue
    # that crashed mid-write re-fires this same processing from scratch,
    # with no human in the loop, the one thing a submission issue has that
    # a vote issue doesn't.
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const author = issue.user.login;

            async function comment(body) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body,
              });
            }

            async function closeIssue() {
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed",
              });
            }

            async function readJson(path) {
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path });
                const content = Buffer.from(res.data.content, "base64").toString("utf8");
                return JSON.parse(content);
              } catch (err) {
                if (err.status === 404) return null;
                throw err;
              }
            }

            function sleep(ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            }

            // Same read-modify-write-with-retry shape as process-vote.yml's
            // own writeJsonWithRetry (kept as its own copy here, not a
            // shared script file, matching this repo's existing convention
            // of each workflow being fully self-contained) -- two different
            // devices of the same model reporting two different newly-
            // discovered raw integers around the same time is a real
            // concurrent-write race on this same per-model file.
            // Found live, 2026-11-24: 5 attempts at a flat 200-500ms backoff
            // wasn't enough for two genuinely different submissions landing
            // on the same per-model file within the same couple of seconds
            // (a real, if rare, risk even outside a burst test -- several
            // households submitting the same popular model around the same
            // OTA rollout) -- every attempt still correctly detected the
            // 409 as retryable, it just ran out of attempts before the
            // conflict cleared. Exponential backoff with jitter, capped,
            // buys real cumulative wait time without an unbounded job.
            async function writeJsonWithRetry(path, mutate, message, maxAttempts = 8) {
              for (let attempt = 0; attempt < maxAttempts; attempt++) {
                let sha;
                let current = null;
                try {
                  const existing = await github.rest.repos.getContent({ owner, repo, path });
                  sha = existing.data.sha;
                  current = JSON.parse(Buffer.from(existing.data.content, "base64").toString("utf8"));
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
                const next = mutate(current);
                const content = Buffer.from(JSON.stringify(next, null, 2) + "\n").toString("base64");
                try {
                  await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message, content, sha });
                  return next;
                } catch (err) {
                  const isConflict = err.status === 409 || err.status === 422;
                  if (!isConflict || attempt === maxAttempts - 1) throw err;
                  const backoff = Math.min(300 * 2 ** attempt, 4000);
                  await sleep(backoff + Math.floor(Math.random() * 300));
                }
              }
            }

            // Same normalization zigbee.py's own zigbee2mqtt_device_url
            // already applies before using a model_id as a URL slug
            // (verified there against zigbee2mqtt.io's own real
            // docgen/utils.ts normalizeModel()) -- needed here for the
            // exact same reason: some real model_ids contain "/" (found
            // live, 2026-11-24, e.g. "8719514440937/8719514440999"), which
            // would otherwise silently create an unintended nested
            // directory instead of one flat file per model, since "/" is
            // both part of the value and this path's own separator.
            function slugifyModelId(modelId) {
              return modelId.replace(/[/| |:]/g, "_");
            }

            // Same split as process-vote.yml's own parseFields.
            function parseFields(body) {
              const fields = {};
              const blocks = body.split(/\n(?=### )/);
              for (const block of blocks) {
                const m = block.match(/^### (.+?)\n([\s\S]*)$/);
                if (!m) continue;
                const label = m[1].trim();
                let value = m[2].trim();
                if (value === "_No response_") value = "";
                fields[label] = value;
              }
              return fields;
            }

            // --- 0. Shape check, and self-apply the "firmware-version"
            // label -- same "GitHub drops labels set at issue creation by a
            // non-collaborator" reasoning as process-vote.yml's own label
            // handling, and the same reason this can't be a job-level `if:`
            // gate either.
            const fields = parseFields(issue.body || "");
            if (!("Raw OTA version" in fields) || !("Real firmware version" in fields)) return;

            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["firmware-version"] });

            // --- 1. Banned check (same moderation list as votes) ---
            const banned = (await readJson("moderation/banned-users.json")) || [];
            if (banned.map((u) => u.toLowerCase()).includes(author.toLowerCase())) {
              await comment("This account is not allowed to submit firmware-version mappings.");
              await closeIssue();
              return;
            }

            async function reject(reason, manufacturer, model, rawVersionText, realVersion) {
              await comment(`This submission could not be processed: ${reason}`);
              // Retitled even on rejection -- found live, 2026-11-24: a
              // rejected issue otherwise kept the unhelpful
              // "[firmware-version]" placeholder forever, same readability
              // problem the success path's own title rewrite was already
              // fixed for. Only when there's actually enough parsed data
              // left to build a meaningful title from (an early rejection,
              // e.g. a missing manufacturer, may not have one yet).
              if (manufacturer && model && rawVersionText && realVersion) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  title: `[firmware-version] ${manufacturer}/${model}: ${rawVersionText} -> ${realVersion}`,
                });
              }
              await closeIssue();
            }

            // --- 2. Parse + validate ---
            const manufacturer = (fields["Manufacturer"] || "").trim();
            const model = (fields["Model"] || "").trim();
            const rawVersionText = (fields["Raw OTA version"] || "").trim();
            const realVersion = (fields["Real firmware version"] || "").trim();

            if (!manufacturer) {
              await reject("manufacturer is missing.");
              return;
            }
            if (!model) {
              await reject("model is missing.");
              return;
            }
            if (!/^\d+$/.test(rawVersionText) || !Number.isSafeInteger(Number(rawVersionText))) {
              await reject("raw OTA version must be a plain, safe integer.", manufacturer, model, rawVersionText, realVersion);
              return;
            }
            // 2-4 numeric components, optional suffix -- deliberately not
            // strict 3-part semver: Hue's own real strings are 3-part
            // ("1.164.2"), but other vendors may differ, and over-
            // constraining here risks rejecting a genuinely real string
            // for a vendor this hasn't been checked against yet. The
            // suffix accepts "_" as well as "-": confirmed live,
            // 2026-11-25, Signify/Hue's own OTA firmware strings carry a
            // build hash after an underscore instead (e.g.
            // "2.44.0_hBB3C188"), stored and shown as the full string,
            // same as every other vendor's own real version already is.
            if (!/^\d+(\.\d+){1,3}([-_].+)?$/.test(realVersion)) {
              await reject(
                `real firmware version "${realVersion}" doesn't look like a version string.`,
                manufacturer, model, rawVersionText, realVersion
              );
              return;
            }
            if (realVersion === rawVersionText) {
              await reject(
                "real firmware version is identical to the raw OTA version -- that's not a real mapping.",
                manufacturer, model, rawVersionText, realVersion
              );
              return;
            }

            // --- 3. Conflict check -- this mapping is meant to be a fixed
            // fact about a specific firmware binary, unlike a vote (an
            // opinion, expected to legitimately change): a mismatch means
            // either a submitting client bug or bad-faith tampering, and
            // silently overwriting it would corrupt a value every other
            // instance already trusts, with no way to tell which of two
            // conflicting values was ever actually correct. Read directly
            // here (not folded into writeJsonWithRetry's own mutate
            // callback) specifically so a conflict can comment+reject
            // instead of writing anything at all -- the mutator below only
            // ever runs once this has already passed.
            const path = `firmware-versions/${manufacturer}/${slugifyModelId(model)}.json`;
            const existing = (await readJson(path)) || {};
            const existingValue = existing[rawVersionText];
            if (existingValue !== undefined && existingValue !== realVersion) {
              await reject(
                `${manufacturer}/${model}'s raw OTA version ${rawVersionText} is already mapped to ` +
                `"${existingValue}", not overwritten with a different value.`,
                manufacturer, model, rawVersionText, realVersion
              );
              return;
            }
            if (existingValue === realVersion) {
              // Already known, identical value -- a harmless duplicate,
              // nothing to write. No comment (see this workflow's own
              // "no success comment" reasoning, same as process-vote.yml's
              // own, except this fires automatically and often with no
              // human decision moment behind it at all, not even an
              // occasional one). Still retitled, same as the real-write
              // path below, so this issue is just as readable in the
              // repo's own history.
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                title: `[firmware-version] ${manufacturer}/${model}: ${rawVersionText} -> ${realVersion}`,
              });
              await closeIssue();
              return;
            }

            // --- 4. Write (retried on a conflicting concurrent write) ---
            await writeJsonWithRetry(
              path,
              (current) => ({ ...(current || {}), [rawVersionText]: realVersion }),
              `${manufacturer}/${model}: ${rawVersionText} -> ${realVersion}`
            );

            // --- 5. Close out -- no success comment, see this workflow's
            // own docstring-equivalent reasoning above. Title rewritten the
            // same way process-vote.yml rewrites its own (every submission
            // otherwise keeps the exact same unhelpful "[firmware-version]"
            // placeholder, making the repo's own issue history unreadable
            // and unsearchable -- direct user feedback, 2026-11-24).
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number,
              title: `[firmware-version] ${manufacturer}/${model}: ${rawVersionText} -> ${realVersion}`,
            });
            await closeIssue();
