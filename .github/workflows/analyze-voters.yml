name: Analyze voters

# Repo-wide voter activity/reliability analysis, regenerated from the
# current votes/ files: how active is each voter, and how often does their
# verdict on a jump agree with what everyone else on that same jump said?
# Someone who often votes "problematic" while most other voters on the same
# jump say "healthy" scores low here. Written for future trusted-voter
# tooling (ha-update-manager's own trusted-voters setting) to eventually
# draw on as inspiration -- nothing consumes analysis/voters.json yet, this
# only keeps it collected and up to date.
on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function walk(dir) {
              let results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) results = results.concat(walk(full));
                else if (entry.isFile() && entry.name.endsWith(".json")) results.push(full);
              }
              return results;
            }

            const stats = new Map();
            function getStats(username) {
              if (!stats.has(username)) {
                stats.set(username, {
                  username,
                  total_votes: 0,
                  healthy_votes: 0,
                  problematic_votes: 0,
                  agreements: 0,
                  contradictions: 0,
                  first_vote_at: null,
                  last_vote_at: null,
                });
              }
              return stats.get(username);
            }

            const voteFiles = walk(path.join(process.cwd(), "votes"));
            for (const file of voteFiles) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              for (const jump of Object.values(data.jumps || {})) {
                const entries = Object.entries(jump.votes || {});
                for (const [username, vote] of entries) {
                  const s = getStats(username);
                  s.total_votes += 1;
                  if (vote.verdict === "healthy") s.healthy_votes += 1;
                  else if (vote.verdict === "problematic") s.problematic_votes += 1;

                  const seenAt = vote.updated_at || vote.created_at;
                  if (vote.created_at && (!s.first_vote_at || vote.created_at < s.first_vote_at)) {
                    s.first_vote_at = vote.created_at;
                  }
                  if (seenAt && (!s.last_vote_at || seenAt > s.last_vote_at)) {
                    s.last_vote_at = seenAt;
                  }

                  // Consensus of every *other* voter on this same jump,
                  // weighted the same way process-vote.yml's own tally
                  // already is -- a tie (including "no other voters at
                  // all") carries no signal either way, so it's skipped
                  // rather than forced into either bucket.
                  let othersHealthy = 0;
                  let othersProblematic = 0;
                  for (const [otherUsername, otherVote] of entries) {
                    if (otherUsername === username) continue;
                    const w = typeof otherVote.weight === "number" ? otherVote.weight : 1;
                    if (otherVote.verdict === "healthy") othersHealthy += w;
                    else if (otherVote.verdict === "problematic") othersProblematic += w;
                  }
                  if (othersHealthy === othersProblematic) continue;
                  const consensus = othersHealthy > othersProblematic ? "healthy" : "problematic";
                  if (vote.verdict === consensus) s.agreements += 1;
                  else s.contradictions += 1;
                }
              }
            }

            const voters = Array.from(stats.values())
              .map((s) => ({
                ...s,
                reliability_score:
                  s.agreements + s.contradictions > 0
                    ? Math.round((s.agreements / (s.agreements + s.contradictions)) * 1000) / 1000
                    : null,
              }))
              .sort((a, b) => b.total_votes - a.total_votes);

            const output = { generated_at: new Date().toISOString(), voters };
            const newContent = JSON.stringify(output, null, 2) + "\n";

            const outputPath = "analysis/voters.json";
            let sha;
            let previousContent = null;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: outputPath });
              sha = existing.data.sha;
              previousContent = Buffer.from(existing.data.content, "base64").toString("utf8");
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            // generated_at always differs run to run, so compare voters
            // only -- an unchanged voter list shouldn't produce a new
            // commit every single scheduled run.
            const previousVoters = previousContent ? JSON.stringify(JSON.parse(previousContent).voters) : null;
            const votersChanged = previousVoters !== JSON.stringify(voters);

            if (votersChanged) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: outputPath,
                content: Buffer.from(newContent).toString("base64"),
                sha,
                message: `Update voter analysis (${voters.length} voters)`,
              });
            } else {
              console.log("No change in voter analysis, skipping voters.json commit.");
            }

            // Top-voters table in analysis/README.md, regenerated the same
            // run (only actually committed if it changed) -- only voters
            // with a real track record (see MIN_COMPARABLE_JUMPS) qualify,
            // so an early lucky 1-for-1 score can't outrank someone with
            // more history behind it.
            const MIN_COMPARABLE_JUMPS = 3;
            const TOP_N = 10;

            const leaderboard = voters
              .filter((v) => v.agreements + v.contradictions >= MIN_COMPARABLE_JUMPS)
              .sort((a, b) => b.reliability_score - a.reliability_score || b.total_votes - a.total_votes)
              .slice(0, TOP_N);

            const tableMarkdown =
              leaderboard.length === 0
                ? `_Not enough voting history yet (each voter needs at least ${MIN_COMPARABLE_JUMPS} jumps with other voters to compare against)._`
                : "| # | Voter | Total votes | Reliability | Healthy | Problematic |\n" +
                  "|---|-------|-------------|-------------|---------|-------------|\n" +
                  leaderboard
                    .map(
                      (v, i) =>
                        `| ${i + 1} | @${v.username} | ${v.total_votes} | ${Math.round(v.reliability_score * 100)}% | ${v.healthy_votes} | ${v.problematic_votes} |`
                    )
                    .join("\n");

            const readmePath = "analysis/README.md";
            const readmeExisting = await github.rest.repos.getContent({ owner, repo, path: readmePath });
            const readmeSha = readmeExisting.data.sha;
            const readmeContent = Buffer.from(readmeExisting.data.content, "base64").toString("utf8");

            const startMarker = "<!-- TOP_VOTERS:START -->";
            const endMarker = "<!-- TOP_VOTERS:END -->";
            const startIdx = readmeContent.indexOf(startMarker);
            const endIdx = readmeContent.indexOf(endMarker);
            if (startIdx === -1 || endIdx === -1) {
              core.warning("TOP_VOTERS markers not found in analysis/README.md, skipping leaderboard update.");
              return;
            }

            const newReadme =
              readmeContent.slice(0, startIdx + startMarker.length) +
              "\n\n" + tableMarkdown + "\n\n" +
              readmeContent.slice(endIdx);

            if (newReadme === readmeContent) {
              console.log("No change in top-voters table, skipping README commit.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: readmePath,
              content: Buffer.from(newReadme).toString("base64"),
              sha: readmeSha,
              message: "Update voter leaderboard in analysis/README.md",
            });
